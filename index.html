.opts{display:flex;flex-direction:column;gap:2px}.opt{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--text2);cursor:pointer;padding:6px 10px;border-radius:var(--rs);transition:background .12s}.opt:hover{background:var(--bg3)}.opt input{flex-shrink:0;width:15px;height:15px;accent-color:var(--gold)}
.ntc{margin-top:24px;padding:12px 16px;background:var(--gold-bg);border:1px solid var(--gold-b);border-radius:var(--rs);font-size:12px;color:var(--gold-l);line-height:1.65;display:flex;gap:10px;align-items:flex-start}
.ff{margin-top:28px;padding-top:24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.ffi{font-size:11px;color:var(--text3);font-family:var(--m);line-height:1.6}
.bp{padding:12px 32px;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--bg);border:none;border-radius:50px;font-family:var(--f);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:0 2px 12px rgba(200,168,78,.2);display:flex;align-items:center;gap:8px}.bp:hover{box-shadow:0 4px 20px rgba(200,168,78,.3);transform:translateY(-1px)}
.bs{padding:10px 22px;border:1px solid var(--border2);border-radius:50px;background:none;cursor:pointer;font-family:var(--f);font-size:12px;font-weight:500;color:var(--text2);transition:all .2s;display:flex;align-items:center;gap:6px}.bs:hover{background:var(--bg3);border-color:var(--gold-d);color:var(--gold-l)}
.ov{display:none;position:fixed;inset:0;z-index:500;background:rgba(9,9,11,.92);backdrop-filter:blur(10px);align-items:center;justify-content:center;flex-direction:column;gap:16px}.ov.sh{display:flex}
.sp{width:32px;height:32px;border:2.5px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:sn .65s linear infinite}@keyframes sn{to{transform:rotate(360deg)}}.spt{font-size:13px;color:var(--text2)}
.tt{position:fixed;bottom:24px;right:24px;z-index:999;padding:12px 18px;border-radius:var(--r);font-size:13px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;transform:translateY(70px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;max-width:340px}.tt.sh{transform:translateY(0);opacity:1}.tt.ok{background:var(--green);color:var(--bg)}.tt.er{background:var(--red);color:#fff}

.tbs{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--border2);border-radius:50px;overflow:hidden;width:fit-content}.tbb{padding:8px 18px;border:none;background:none;cursor:pointer;font-family:var(--f);font-size:12px;font-weight:500;color:var(--text2);transition:all .15s;border-right:1px solid var(--border2);display:flex;align-items:center;gap:5px}.tbb:last-child{border-right:none}.tbb.a{background:var(--gold);color:var(--bg);font-weight:600}
.hsc{margin-bottom:16px}.hsc input{background:var(--bg3);border-color:var(--border)}

.ht{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px}
.hd{font-family:var(--m);font-size:10px;color:var(--gold);font-weight:500}.hbs{display:flex;gap:4px;flex-wrap:wrap}.hb{font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px}.hbc{background:var(--gold-bg);color:var(--gold-l);border:1px solid var(--gold-b)}.hbs2{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(91,163,245,.15)}
.hby{font-size:12px;color:var(--text2);line-height:1.6;white-space:pre-wrap;word-wrap:break-word}.hid{font-family:var(--m);font-size:10px;color:var(--text3);margin-top:6px}.hem{text-align:center;padding:36px 20px;color:var(--text3);font-size:12px}.hcn{font-size:10px;color:var(--text3);margin-bottom:10px;font-family:var(--m)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px}.chd{text-align:center;font-size:9px;font-weight:600;color:var(--text3);padding:6px 0;text-transform:uppercase;letter-spacing:.1em}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--rs);font-size:12px;color:var(--text2);cursor:pointer;transition:all .12s;border:1px solid transparent;position:relative}.cd:hover{background:var(--bg3);border-color:var(--border2)}.cd.td{border-color:var(--gold);color:var(--gold-l);font-weight:600}.cd.he::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--gold);position:absolute;bottom:3px}.cd.dm{color:var(--text3);opacity:.35}

.ca{display:flex;gap:8px;margin-top:12px;display:none}.ca.sh{display:flex}

/* STRATEGY BOARD */
.board{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);min-height:400px;position:relative;overflow:hidden;margin-bottom:20px}
.board-canvas{width:100%;min-height:400px;padding:24px;position:relative}
.node{position:absolute;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:12px 16px;min-width:140px;cursor:move;transition:border-color .15s,box-shadow .15s;user-select:none;z-index:10}
.node:hover{border-color:var(--gold-d);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.node.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-bg)}
.node-title{font-size:12px;font-weight:600;color:var(--white);margin-bottom:2px}
.node-desc{font-size:10px;color:var(--text2);line-height:1.4}
.node-type{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;margin-bottom:6px;display:inline-block}
.board-toolbar{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg3);flex-wrap:wrap;align-items:center}
.toolbar-btn{padding:6px 12px;border:1px solid var(--border2);border-radius:var(--rs);background:none;cursor:pointer;font-family:var(--f);font-size:11px;color:var(--text2);transition:all .15s;display:flex;align-items:center;gap:5px}.toolbar-btn:hover{background:var(--bg4);border-color:var(--gold-d);color:var(--text)}
.toolbar-sep{width:1px;height:20px;background:var(--border2);margin:0 4px}

/* STRATEGY CARDS */
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.strat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:16px;cursor:pointer;transition:all .15s}.strat-card:hover{border-color:var(--gold-d);transform:translateY(-1px)}
.strat-card-title{font-size:13px;font-weight:600;color:var(--white);margin-bottom:4px}
.strat-card-client{font-size:11px;color:var(--gold);font-family:var(--m);margin-bottom:6px}
.strat-card-type{font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:8px}
.strat-card-date{font-size:10px;color:var(--text3);font-family:var(--m)}
.strat-card-status{font-size:10px;font-weight:500;margin-top:6px;display:flex;align-items:center;gap:4px}
.status-dot{width:6px;height:6px;border-radius:50%}

/* CRONOGRAMA */
.crono-row{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--rs);margin-bottom:6px;overflow:hidden;background:var(--bg2)}
.crono-label{min-width:180px;padding:10px 14px;border-right:1px solid var(--border);font-size:12px;font-weight:500;color:var(--text);display:flex;flex-direction:column;justify-content:center;gap:2px}
.crono-label-sub{font-size:10px;color:var(--text2);font-weight:400}
.crono-bar{flex:1;padding:10px 14px;display:flex;align-items:center}
.crono-fill{height:6px;border-radius:3px;min-width:20px}
.crono-meta{font-size:10px;color:var(--text2);margin-left:10px;font-family:var(--m);white-space:nowrap}

/* AI INSIGHT */
.ai-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:16px;margin-bottom:10px}
.ai-card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ai-card-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:3px}
.ai-card-title{font-size:13px;font-weight:500;color:var(--text)}
.ai-card-body{font-size:12px;color:var(--text2);line-height:1.6}

@media(max-width:640px){.sb{display:none}.ly{grid-template-columns:1fr}.mt{display:flex}.mn{padding:20px 16px;max-width:100%}.met{flex-wrap:wrap}.me{border-bottom:1px solid var(--border2);border-right:none;min-width:calc(50% - 1px)}.me:last-child{border-bottom:none}.hdr .logo-lbl{display:none}.ff{flex-direction:column;align-items:stretch}.bp{justify-content:center}.dg{grid-template-columns:repeat(2,1fr)}.strat-grid{grid-template-columns:1fr}.crono-label{min-width:120px}}
</style>

function getAIKey(){return localStorage.getItem('sx_ai_key')||''}

async function callAI(prompt,maxTk){const key=getAIKey();const hdrs={'Content-Type':'application/json'};if(key){hdrs['x-api-key']=key;hdrs['anthropic-version']='2023-06-01';hdrs['anthropic-dangerous-direct-browser-access']='true';}const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:hdrs,body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:maxTk||1000,messages:[{role:'user',content:prompt}]})});if(!r.ok){const err=await r.json().catch(()=>({}));if(r.status===401||r.status===403){throw new Error('API Key invalida ou ausente. Configure em Configuracoes.');}throw new Error(err.error?.message||'Erro '+r.status);}return await r.json();}

async function gCopy(){const c=document.getElementById('cp_c').value.trim(),n=document.getElementById('cp_n').value.trim(),t=document.getElementById('cp_t').value,a=document.getElementById('cp_a').value,m=document.getElementById('cp_m').value,p=document.getElementById('cp_p').value.trim(),ct=document.getElementById('cp_cta')?.value?.trim()||'',x=document.getElementById('cp_x')?.value?.trim()||'';if(!c||!n||!t||!a||!m||!p){toast('Preencha os campos obrigatorios','er');return;}if(!getAIKey()){toast('Configure sua API Key nas Configuracoes','er');return;}document.getElementById('cpl').classList.add('sh');document.getElementById('cpo').classList.remove('sh');document.getElementById('cpa').classList.remove('sh');try{const d=await callAI(`Copywriter expert BR. Copy pronta.\nCLIENTE:${c}\nNICHO:${n}\nTIPO:${t}\nANGULO:${a}\nTOM:${m}\nPRODUTO:${p}\n${ct?'CTA:'+ct:''}${x?'\nEXTRA:'+x:''}\nRegras: pt-BR natural, emojis moderados, CTA forte. Se carrossel separe por slides. Se Reels escreva roteiro. So a copy, sem explicacao.`,1000);document.getElementById('cpl').classList.remove('sh');document.getElementById('cpo').textContent=d.content?.map(c=>c.text||'').join('\n')||'Erro.';document.getElementById('cpo').classList.add('sh');document.getElementById('cpa').classList.add('sh');}catch(e){document.getElementById('cpl').classList.remove('sh');toast('Erro: '+e.message,'er');}}

const strat={name:n,client:c,type:t,objective:obj,budget:orc,startDate:di,endDate:df,kpis:kpi,description:desc,squads:sq,date:new Date().toLocaleDateString('pt-BR'),status:'planning',tasks:[],cronograma:null,timestamp:Date.now()};

async function genCrono(i){const strats=gs('strategies');const s=strats[i];if(!s)return;if(!getAIKey()){toast('Configure sua API Key nas Configuracoes','er');return;}loading(true,'Gerando cronograma com IA...');
try{const d=await callAI(`Voce e um estrategista de marketing digital. Gere um cronograma operacional de 30 dias baseado nesta estrategia:\n\nNOME: ${s.name}\nCLIENTE: ${s.client}\nTIPO: ${s.type}\nOBJETIVO: ${s.objective}\nORCAMENTO: ${s.budget||'Nao definido'}\nINICIO: ${s.startDate}\nFIM: ${s.endDate}\nKPIs: ${s.kpis}\nDESCRICAO: ${s.description}\nSQUADS: ${s.squads.join(', ')}\n\nGere um cronograma semana a semana com:\n- Tarefas especificas por squad\n- Prioridades (alta/media/baixa)\n- Dependencias entre tarefas\n- Datas estimadas\n- Responsaveis por squad\n- Marcos importantes\n\nFormate de forma clara e organizada. Apenas o cronograma, sem explicacoes.`,2000);const txt=d.content?.map(c=>c.text||'').join('\n')||'Erro.';strats[i].cronograma=txt;ss('strategies',strats);loading(false);sT='view';currentStratIdx=i;rStrat();toast('Cronograma gerado!','ok');}catch(e){loading(false);toast('Erro: '+e.message,'er');}}

async function genTasks(i){const strats=gs('strategies');const s=strats[i];if(!s)return;if(!getAIKey()){toast('Configure sua API Key nas Configuracoes','er');return;}loading(true,'Gerando tarefas com IA...');
try{const d=await callAI(`Gere uma lista de tarefas operacionais baseada nesta estrategia de marketing:\n\nNOME: ${s.name}\nCLIENTE: ${s.client}\nOBJETIVO: ${s.objective}\nDESCRICAO: ${s.description}\nSQUADS: ${s.squads.join(', ')}\nPERIODO: ${s.startDate} a ${s.endDate}\n\nResposta APENAS em JSON valido (sem markdown). Array de objetos com:\n{"name":"nome da tarefa","squad":"nome do squad","priority":"Alta|Media|Baixa","deadline":"DD/MM","progress":0}\n\nMaximo 15 tarefas. Apenas o JSON.`,1500);const txt=d.content?.map(c=>c.text||'').join('')||'[]';let tasks=[];try{tasks=JSON.parse(txt.replace(/```json|```/g,'').trim());}catch(e){tasks=[];}if(tasks.length){strats[i].tasks=tasks;ss('strategies',strats);}loading(false);sT='view';currentStratIdx=i;rStrat();if(tasks.length)toast(tasks.length+' tarefas geradas!','ok');else toast('Erro ao gerar tarefas','er');}catch(e){loading(false);toast('Erro: '+e.message,'er');}}

// SUBMITS
function col(k){const f=FM[k];const d={};const m=[];f.sections.forEach(s=>{s.f.forEach(field=>{const nm=`${k}_${field.id}`;let v='';if(field.type==='text'||field.type==='url'||field.type==='area')v=(document.getElementById(nm)||{}).value?.trim()||'';else if(field.type==='check')v=[...document.querySelectorAll(`input[name="${nm}"]:checked`)].map(e=>e.value).join(', ');else if(field.type==='radio')v=(document.querySelector(`input[name="${nm}_r"]:checked`)||{}).value||'';if(field.r&&!v)m.push(field.l);d[field.l]=v||'';});});return{data:d,missing:m};}
function bDesc(k,d){const f=FM[k];let desc=`${f.title}\n${new Date().toLocaleDateString('pt-BR')} - SPEEDX\n\n`;f.sections.forEach(s=>{desc+=`--- ${s.t.toUpperCase()} ---\n`;s.f.forEach(field=>{const v=d[field.l];if(v)desc+=`${field.l}: ${v}\n`;});desc+='\n';});return desc;}
function gDue(d){if(!d)return undefined;const dt=new Date();let a=0;while(a<d){dt.setDate(dt.getDate()+1);if(dt.getDay()!==0&&dt.getDay()!==6)a++;}return dt.getTime();}

async function subForm(k){const{data,missing}=col(k);if(missing.length){toast('Preencha: '+missing.slice(0,2).join(', '),'er');return;}const f=FM[k];const cn=data['Cliente']||data['Cliente / @']||'';const tn=`[${f.badge}] ${cn} - ${new Date().toLocaleDateString('pt-BR')}`;loading(true,'Criando tarefa...');try{const b={name:tn,description:bDesc(k,data),assignees:[LA[k]],priority:2,notify_all:true};const due=gDue(SD[k]);if(due){b.due_date=due;b.due_date_time=false;}const r=await fetch(`https://api.clickup.com/api/v2/list/${LS[k]}/task`,{method:'POST',headers:{'Authorization':AK,'Content-Type':'application/json'},body:JSON.stringify(b)});const rs=await r.json();loading(false);if(r.ok&&rs.id)done('Tarefa criada',`Atribuida para ${f.slas.find(s=>s.k==='Resp').v}.`,rs.id);else throw new Error(rs.err||'Erro');}catch(e){loading(false);toast('Erro: '+e.message,'er');}}

async function subDaily(){const c=document.getElementById('d_c').value.trim(),s=document.getElementById('d_s').value,t=document.getElementById('d_t').value.trim(),l=document.getElementById('d_l')?.value?.trim()||'';if(!c||!s||!t){toast('Preencha os obrigatorios','er');return;}const dh=new Date().toLocaleDateString('pt-BR');loading(true,'Salvando...');try{const r=await fetch(`https://api.clickup.com/api/v2/list/${LS.daily}/task`,{method:'POST',headers:{'Authorization':AK,'Content-Type':'application/json'},body:JSON.stringify({name:`[Atualizacao] ${c} - ${s} - ${dh}`,description:`ATUALIZACAO DIARIA\n${dh}\n\nCliente: ${c}\nSetor: ${s}\n\n${t}${l?'\n\nLinks: '+l:''}`,assignees:[LA.daily],priority:3,notify_all:true})});const rs=await r.json();loading(false);if(r.ok&&rs.id){addS('daily',{data:dh,dateISO:new Date().toISOString().split('T')[0],cliente:c,setor:s,texto:t,links:l,taskId:rs.id});done('Atualizacao salva',c+' - '+s,rs.id);}else throw new Error(rs.err||'Erro');}catch(e){loading(false);toast('Erro: '+e.message,'er');}}

async function subMeet(){const n=document.getElementById('c_n').value.trim(),c=document.getElementById('c_c').value.trim(),p=document.getElementById('c_p')?.value?.trim()||'',d=document.getElementById('c_d').value,hr=document.getElementById('c_h').value,lk=document.getElementById('c_l')?.value?.trim()||'',ob=document.getElementById('c_o')?.value?.trim()||'';if(!n||!c||!d||!hr){toast('Preencha nome, cliente, data e horario','er');return;}const dl=new Date(d+'T12:00:00').toLocaleDateString('pt-BR');loading(true,'Agendando...');try{const r=await fetch(`https://api.clickup.com/api/v2/list/${LS.calendar}/task`,{method:'POST',headers:{'Authorization':AK,'Content-Type':'application/json'},body:JSON.stringify({name:`[Reuniao] ${n} - ${c} - ${dl}`,description:`REUNIAO\n\n${n}\nCliente: ${c}\nData: ${dl} ${hr}\nParticipantes: ${p||'—'}\nLink: ${lk||'—'}\nObs: ${ob||'—'}`,assignees:[LA.calendar],priority:2,notify_all:true,due_date:new Date(d+'T'+hr).getTime(),due_date_time:true})});const rs=await r.json();loading(false);if(r.ok&&rs.id){addS('meetings',{nome:n,cliente:c,participantes:p,dateISO:d,horario:hr,link:lk,obs:ob,taskId:rs.id});done('Reuniao agendada',n+' - '+dl+' '+hr,rs.id);}else throw new Error(rs.err||'Erro');}catch(e){loading(false);toast('Erro: '+e.message,'er');}}

function done(t,m,id){document.getElementById('fc').innerHTML='';document.getElementById('dt').textContent=t;document.getElementById('dm').textContent=m;document.getElementById('di').textContent='ID: '+id;document.getElementById('ds').classList.add('sh');}
function rf(){document.getElementById('ds').classList.remove('sh');if(cur==='dash')rDash();else if(cur==='daily'){dT='form';rDaily();}else if(cur==='calendar'){cT='new';rCal();}else if(cur==='copy')rCopy();else if(cur==='strategy'){sT='list';rStrat();}else if(cur==='config')rConfig();else rForm(cur);}

function rConfig(){let h=`<div class="ey" style="background:var(--bg4);color:var(--text2);border:1px solid var(--border2)">Sistema</div><h1 class="pt">Configuracoes</h1><p class="ps">Configure as integracoes do sistema SPEEDX.</p>`;
h+=`<div class="sec"><div class="sect"><svg class="ic"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> API Key — Anthropic (IA)</div>`;
h+=`<div class="fh" style="margin-bottom:12px">Necessaria para o Gerador de Copy, Cronograma IA e Geracao de Tarefas. Obtenha em <a href="https://console.anthropic.com/settings/keys" target="_blank" style="color:var(--blue)">console.anthropic.com</a></div>`;
const hasKey=getAIKey();
const keyStatusTag=hasKey?'<span class="tg" style="background:var(--green-bg);color:var(--green);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px">Configurada</span>':'<span class="tg tg-r">Nao configurada</span>';
h+=`<div class="fld"><div class="fl">API Key ${keyStatusTag}</div><input type="password" id="cfg_key" placeholder="sk-ant-..." value="${hasKey?'sk-ant-••••••••'+getAIKey().slice(-4):''}"><div class="fh" style="margin-top:6px">Sua chave fica salva apenas no navegador (localStorage). Nunca e enviada para terceiros.</div></div>`;
h+=`<div style="display:flex;gap:8px;margin-top:16px"><button class="bp" onclick="saveKey()" style="padding:10px 24px;font-size:12px"><svg class="ic"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> Salvar</button>${hasKey?`<button class="bs" onclick="clearKey()"><svg class="ic"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg> Remover chave</button>`:''}</div></div>`;
h+=`<div class="sec" style="margin-top:28px"><div class="sect"><svg class="ic"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Status das integracoes</div>`;
h+=`<div class="hc" style="margin-bottom:8px"><div class="ht"><div style="font-size:13px;font-weight:500;color:var(--text)">ClickUp</div><div class="hbs"><span class="hb" style="background:var(--green-bg);color:var(--green);border:1px solid rgba(78,203,113,.15)">Conectado</span></div></div><div class="hby" style="font-size:11px">Token ativo. Briefings, atualizacoes e reunioes sincronizando automaticamente.</div></div>`;
const aiStatusBadge=hasKey?'<span class="hb" style="background:var(--green-bg);color:var(--green);border:1px solid rgba(78,203,113,.15)">Conectado</span>':'<span class="hb" style="background:var(--red-bg);color:var(--red);border:1px solid rgba(226,85,85,.15)">Nao configurado</span>';
const aiStatusText=hasKey?'API Key configurada. Gerador de Copy, Cronograma e Tarefas disponiveis.':'Configure sua API Key acima para usar as funcionalidades de IA.';
h+=`<div class="hc"><div class="ht"><div style="font-size:13px;font-weight:500;color:var(--text)">Anthropic IA</div><div class="hbs">${aiStatusBadge}</div></div><div class="hby" style="font-size:11px">${aiStatusText}</div></div>`;
h+=`</div>`;
document.getElementById('fc').innerHTML=h;}

function saveKey(){const v=document.getElementById('cfg_key').value.trim();if(!v||v.includes('•')){toast('Insira uma API Key valida','er');return;}if(!v.startsWith('sk-ant-')){toast('A chave deve comecar com sk-ant-','er');return;}setAIKey(v);toast('API Key salva com sucesso!','ok');rConfig();}
function clearKey(){localStorage.removeItem('sx_ai_key');toast('API Key removida','ok');rConfig();}
function loading(s,t){document.getElementById('ov').classList.toggle('sh',s);if(t)document.getElementById('ovt').textContent=t;}
function toast(m,t){const el=document.getElementById('tt');el.textContent=m;el.className=`tt ${t} sh`;setTimeout(()=>el.classList.remove('sh'),4000);}

rDash();
</script>
</body>
</html>
