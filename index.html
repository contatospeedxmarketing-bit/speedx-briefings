<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Briefings — SPEEDX MARKETING</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap');

:root {
  --black: #0C0C0E;
  --white: #FAFAF8;
  --surface: #F2F1EE;
  --border: #E0DED9;
  --muted: #8A8880;
  --text: #1A1A1C;
  --text2: #5C5B58;
  --radius: 10px;
  --rsm: 6px;
  --coral: #D85A30;
  --blue: #1A6DD4;
  --green: #1A8A5C;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--white);
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */
.hdr {
  position: sticky; top: 0; z-index: 200;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.logo em { color: var(--coral); font-style: normal; }
.hdr-right { display: flex; align-items: center; gap: 12px; }
.hdr-tag { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
.hdr-status { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; background: #EAF5F0; color: #1A8A5C; display: flex; align-items: center; gap: 5px; }
.hdr-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #1A8A5C; }

/* LAYOUT */
.layout { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 56px); }

/* SIDEBAR */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  position: sticky; top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
}
.sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 8px; margin-bottom: 8px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 8px;
  border: none; background: none;
  border-radius: var(--rsm);
  cursor: pointer; text-align: left;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; color: var(--text2);
  transition: all .15s;
  margin-bottom: 2px;
}
.nav-btn:hover { background: var(--surface); color: var(--text); }
.nav-btn.active { background: var(--black); color: var(--white); }
.nav-btn.active .nav-dot { border-color: rgba(255,255,255,.3); }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid transparent; }
.nav-sla { font-family: 'DM Mono', monospace; font-size: 10px; margin-left: auto; opacity: .55; }
.sidebar-sep { border-top: 1px solid var(--border); margin: 16px 0; }
.sidebar-tip { font-size: 11px; color: var(--muted); padding: 0 8px; line-height: 1.7; }
.sidebar-tip strong { color: var(--text2); font-weight: 500; }

/* MAIN */
.main { padding: 36px 44px; max-width: 720px; }

/* FORM HEADER */
.form-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 20px;
  font-family: 'DM Mono', monospace;
  margin-bottom: 10px;
}
.form-title { font-size: 24px; font-weight: 600; letter-spacing: -.02em; color: var(--black); margin-bottom: 5px; }
.form-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }

/* SLA BAR */
.sla-bar {
  display: flex; gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--rsm);
  overflow: hidden;
  margin-bottom: 28px;
}
.sla-item { flex: 1; padding: 10px 14px; border-right: 1px solid var(--border); }
.sla-item:last-child { border-right: none; }
.sla-k { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.sla-v { font-size: 12px; font-weight: 500; color: var(--text); font-family: 'DM Mono', monospace; }

/* SECTIONS */
.section { margin-bottom: 28px; }
.sec-title {
  font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  padding-bottom: 8px; margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

/* FIELDS */
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
.f-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; }
.tag-r { background: #FEEDE6; color: var(--coral); }
.tag-o { background: var(--surface); color: var(--muted); }
.f-hint { font-size: 11px; color: var(--muted); margin-bottom: 5px; }

input[type=text], input[type=url], textarea, select {
  width: 100%;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; color: var(--text);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--rsm);
  padding: 9px 12px;
  outline: none; transition: border-color .15s; resize: vertical;
}
input[type=text]:focus, input[type=url]:focus, textarea:focus, select:focus { border-color: var(--black); }

.opt-group { display: flex; flex-direction: column; gap: 5px; }
.opt-item { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; color: var(--text2); cursor: pointer; padding: 1px 0; }
.opt-item input { margin-top: 2px; flex-shrink: 0; accent-color: var(--black); width: 14px; height: 14px; }

/* WARN */
.warn-box {
  margin-top: 24px; padding: 12px 14px;
  background: #FEF3EE; border: 1px solid #F5C4A8;
  border-radius: var(--rsm);
  font-size: 12px; color: #8A3515; line-height: 1.65;
  display: flex; gap: 10px;
}
.warn-icon { flex-shrink: 0; }

/* SUBMIT AREA */
.submit-area {
  margin-top: 28px; padding-top: 22px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: gap;
  gap: 12px;
}
.submit-info { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; line-height: 1.6; }
.btn-submit {
  padding: 11px 28px;
  background: var(--black); color: var(--white);
  border: none; border-radius: var(--rsm);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500;
  cursor: pointer; transition: opacity .15s;
  white-space: nowrap;
}
.btn-submit:hover { opacity: .85; }
.btn-submit:disabled { opacity: .4; cursor: not-allowed; }

/* TOAST */
.toast {
  position: fixed; bottom: 28px; right: 28px; z-index: 999;
  padding: 14px 20px; border-radius: var(--radius);
  font-size: 13px; font-weight: 500;
  box-shadow: 0 4px 24px rgba(0,0,0,.12);
  display: flex; align-items: center; gap: 10px;
  transform: translateY(80px); opacity: 0;
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: #1A8A5C; color: white; }
.toast.error { background: #C0392B; color: white; }

/* LOADING OVERLAY */
.loading-overlay {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(250,250,248,.8); backdrop-filter: blur(3px);
  align-items: center; justify-content: center; flex-direction: column; gap: 16px;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 2.5px solid var(--border);
  border-top-color: var(--black);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text2); }
</style>
</head>

// ─── STATE ────────────────────────────────────────────────
let currentForm = 'designer';
const formData = {};

// ─── RENDER FORM ──────────────────────────────────────────
function selectForm(key, btn) {
  currentForm = key;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderForm(key);
}

function renderForm(key) {
  const f = FORMS[key];
  let h = '';

  h += `<div class="form-eyebrow" style="background:${f.badgeBg};color:${f.badgeColor}">${f.badge}</div>`;
  h += `<h1 class="form-title">${f.title}</h1>`;
  h += `<p class="form-sub">${f.sub}</p>`;

  h += `<div class="sla-bar">`;
  f.slas.forEach(s => h += `<div class="sla-item"><div class="sla-k">${s.k}</div><div class="sla-v">${s.v}</div></div>`);
  h += `</div>`;

  f.sections.forEach(sec => {
    h += `<div class="section"><div class="sec-title">${sec.t}</div>`;
    sec.f.forEach(field => {
      const nm = `${key}_${field.id}`;
      h += `<div class="field">`;
      h += `<div class="f-label">${field.l} <span class="tag ${field.r ? 'tag-r' : 'tag-o'}">${field.r ? 'Obrigatório' : 'Opcional'}</span></div>`;
      if (field.h) h += `<div class="f-hint">${field.h}</div>`;

      if (field.type === 'text' || field.type === 'url') {
        h += `<input type="${field.type === 'url' ? 'url' : 'text'}" id="${nm}" placeholder="${field.p || ''}">`;
      } else if (field.type === 'area') {
        h += `<textarea id="${nm}" rows="3" placeholder="${field.p || ''}"></textarea>`;
      } else if (field.type === 'check') {
        h += `<div class="opt-group">`;
        field.o.forEach((o, i) => h += `<label class="opt-item"><input type="checkbox" name="${nm}" value="${o}" id="${nm}_${i}"> ${o}</label>`);
        h += `</div>`;
      } else if (field.type === 'radio') {
        const rn = nm + '_r';
        h += `<div class="opt-group">`;
        field.o.forEach((o, i) => h += `<label class="opt-item"><input type="radio" name="${rn}" value="${o}" id="${nm}_${i}"> ${o}</label>`);
        h += `</div>`;
      }
      h += `</div>`;
    });
    h += `</div>`;
  });

  h += `<div class="warn-box"><span class="warn-icon">⚠</span><span>${f.warn}</span></div>`;

  h += `<div class="submit-area">
    <div class="submit-info">
      Ao enviar, a tarefa é criada no ClickUp<br>e atribuída automaticamente ao responsável.
    </div>
    <button class="btn-submit" onclick="submitForm('${key}')">Enviar para o ClickUp →</button>
  </div>`;

  document.getElementById('mainContent').innerHTML = h;
}

// ─── COLLECT DATA ─────────────────────────────────────────
function collectForm(key) {
  const f = FORMS[key];
  const data = {};
  let missing = [];

  f.sections.forEach(sec => {
    sec.f.forEach(field => {
      const nm = `${key}_${field.id}`;
      let val = '';

      if (field.type === 'text' || field.type === 'url' || field.type === 'area') {
        const el = document.getElementById(nm);
        val = el ? el.value.trim() : '';
      } else if (field.type === 'check') {
        const checked = [...document.querySelectorAll(`input[name="${nm}"]:checked`)].map(el => el.value);
        val = checked.join(', ');
      } else if (field.type === 'radio') {
        const checked = document.querySelector(`input[name="${nm}_r"]:checked`);
        val = checked ? checked.value : '';
      }

      if (field.r && !val) missing.push(field.l);
      data[field.l] = val || '—';
    });
  });

  return { data, missing };
}

// ─── BUILD DESCRIPTION ────────────────────────────────────
function buildDescription(key, data) {
  const f = FORMS[key];
  let desc = `📋 *Briefing de ${f.title}*\n`;
  desc += `Criado via formulário SPEEDX · ${new Date().toLocaleDateString('pt-BR')}\n\n`;

  f.sections.forEach(sec => {
    desc += `---\n*${sec.t.toUpperCase()}*\n`;
    sec.f.forEach(field => {
      const val = data[field.l];
      if (val && val !== '—') {
        desc += `• *${field.l}:* ${val}\n`;
      }
    });
    desc += '\n';
  });

  return desc;
}

// ─── CALCULATE DUE DATE ───────────────────────────────────
function getDueDate(days) {
  const d = new Date();
  let added = 0;
  while (added < days) {
    d.setDate(d.getDate() + 1);
    if (d.getDay() !== 0 && d.getDay() !== 6) added++;
  }
  return d.getTime();
}

// ─── SUBMIT ───────────────────────────────────────────────
async function submitForm(key) {
  const { data, missing } = collectForm(key);

  if (missing.length > 0) {
    showToast(`Preencha os campos obrigatórios: ${missing.slice(0,2).join(', ')}${missing.length > 2 ? '...' : ''}`, 'error');
    return;
  }

  const f = FORMS[key];
  const clientName = data['Cliente'] || data['Cliente / @ do perfil'] || 'Cliente';
  const taskName = `[${f.badge.split('·')[0].trim()}] ${clientName} — ${new Date().toLocaleDateString('pt-BR')}`;

  showLoading(true, 'Criando tarefa no ClickUp...');

  try {
    const body = {
      name: taskName,
      description: buildDescription(key, data),
      assignees: [LIST_ASSIGNEE[key]],
      due_date: getDueDate(SLA_DAYS[key]),
      due_date_time: false,
      priority: 2,
      notify_all: true,
    };

    const res = await fetch(`https://api.clickup.com/api/v2/list/${LISTS[key]}/task`, {
      method: 'POST',
      headers: {
        'Authorization': API_TOKEN,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });

    const result = await res.json();
    showLoading(false);

    if (res.ok && result.id) {
      showToast(`✓ Tarefa criada com sucesso no ClickUp!`, 'success');
      setTimeout(() => renderForm(key), 2000);
    } else {
      throw new Error(result.err || 'Erro desconhecido');
    }
  } catch (err) {
    showLoading(false);
    showToast(`Erro ao criar tarefa: ${err.message}`, 'error');
  }
}

// ─── UI HELPERS ───────────────────────────────────────────
function showLoading(show, text = '') {
  const el = document.getElementById('loadingOverlay');
  el.classList.toggle('show', show);
  if (text) document.getElementById('loadingText').textContent = text;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => { t.classList.remove('show'); }, 4000);
}

// ─── INIT ─────────────────────────────────────────────────
renderForm('designer');
</script>
